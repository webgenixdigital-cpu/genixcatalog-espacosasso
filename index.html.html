<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Serviços — Espaço Sasso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#6B2136;
    --maroon-dark:#4C1826;
    --blush:#F7E7EB;
    --blush-2:#F1DCE2;
    --ivory:#FBF7F3;
    --gold:#C9A15A;
    --espresso:#2B2320;
    --line: rgba(75,24,38,0.14);
    --radius: 14px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--espresso);
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== HEADER ===== */
  header{
    position:relative;
    overflow:hidden;
    background:var(--ivory);
    padding:56px 24px 40px;
  }
  .header-inner{
    max-width:1080px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:36px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .logo-mark img{
    width:min(360px, 78vw);
    height:auto;
    display:block;
  }
  .header-banner{
    background:var(--maroon);
    color:#fff;
    border-radius:999px 60px 60px 999px;
    padding:26px 48px 26px 56px;
    flex:1;
    min-width:260px;
    max-width:460px;
    position:relative;
  }
  .header-banner h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(30px, 4.4vw, 44px);
    line-height:1.04;
    margin:0;
    letter-spacing:-0.01em;
  }
  .slogan-wrap{
    text-align:center;
    margin-top:28px;
  }
  .slogan{
    font-size:13px;
    letter-spacing:.32em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--maroon-dark);
  }

  /* ===== FILTERS ===== */
  .filters-wrap{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(251,247,243,0.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:16px 24px;
  }
  .filters{
    max-width:1080px;
    margin:0 auto;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .chip{
    border:1px solid var(--line);
    background:#fff;
    color:var(--espresso);
    padding:9px 18px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    transition:all .18s ease;
    font-family:'Manrope',sans-serif;
    white-space:nowrap;
  }
  .chip:hover{ border-color:var(--maroon); }
  .chip.active{
    background:var(--maroon);
    border-color:var(--maroon);
    color:#fff;
  }

  /* ===== GRID ===== */
  main{
    max-width:1080px;
    margin:0 auto;
    padding:48px 24px 100px;
  }
  .category-block{ margin-bottom:56px; }
  .category-title{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:23px;
    color:var(--maroon);
    margin:0 0 20px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .category-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:20px;
  }

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 30px -18px rgba(75,24,38,0.35);
  }
  .card-media{
    height:8px;
    background:linear-gradient(90deg, var(--maroon), var(--gold));
  }
  .card-body{
    padding:20px 20px 22px;
    display:flex;
    flex-direction:column;
    flex:1;
  }
  .card-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18.5px;
    margin:0 0 2px;
    line-height:1.2;
  }
  .card-note{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:13.5px;
    color:var(--maroon);
    margin:0 0 10px;
  }
  .card-desc{
    font-size:13.5px;
    line-height:1.5;
    color:rgba(43,35,32,0.66);
    margin:0 0 16px;
    flex:1;
  }
  .card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .price-block .from{
    font-family:'Manrope',sans-serif;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:rgba(43,35,32,0.45);
    display:block;
    margin-bottom:2px;
  }
  .price-block .price{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:17px;
    color:var(--maroon-dark);
  }
  .price-block.special .price{
    font-size:14.5px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--maroon);
    color:#fff;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    padding:10px 16px;
    border-radius:999px;
    transition:background .18s ease;
    white-space:nowrap;
    flex-shrink:0;
  }
  .btn:hover{ background:var(--maroon-dark); }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:rgba(43,35,32,0.5);
    font-size:15px;
    display:none;
  }

  footer{
    text-align:center;
    padding:32px 24px 48px;
    font-size:12.5px;
    color:rgba(43,35,32,0.45);
    border-top:1px solid var(--line);
  }

  /* ===== WHATSAPP FLOAT BUTTON ===== */
  .whatsapp-float{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:40;
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:14px 20px 14px 14px;
    border-radius:999px;
    box-shadow:0 10px 24px -8px rgba(37,211,102,0.55);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .whatsapp-float:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 30px -8px rgba(37,211,102,0.65);
  }
  .whatsapp-float svg{ width:26px; height:26px; flex-shrink:0; }
  .whatsapp-float span{ white-space:nowrap; }

  @media(max-width:600px){
    .whatsapp-float span{ display:none; }
    .whatsapp-float{ padding:14px; }
  }

  @media(max-width:600px){
    .header-inner{ flex-direction:column; text-align:center; }
    .header-banner{
      border-radius:32px;
      text-align:center;
      padding:24px 28px;
      max-width:100%;
    }
    header{ padding:40px 18px 32px; }
    .filters-wrap{ padding:12px 14px; }
  }
</style>
</head>

}

function renderFilters(){
  filtersEl.innerHTML = categories.map(cat =>
    `<button class="chip ${cat === activeFilter ? 'active' : ''}" data-cat="${cat}">${cat}</button>`
  ).join('');

  filtersEl.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeFilter = chip.dataset.cat;
      renderFilters();
      renderCatalog();
    });
  });
}

function renderCatalog(){
  const grouped = {};
  SERVICES
    .filter(s => activeFilter === "Todos" || s.category === activeFilter)
    .forEach(s => {
      grouped[s.category] = grouped[s.category] || [];
      grouped[s.category].push(s);
    });

  const cats = Object.keys(grouped);
  emptyState.style.display = cats.length === 0 ? 'block' : 'none';

  catalogEl.innerHTML = cats.map(cat => `
    <section class="category-block">
      <h2 class="category-title">${cat}</h2>
      <div class="grid">
        ${grouped[cat].map(s => {
          const label = s.priceLabel === undefined ? "a partir de" : s.priceLabel;
          const isSpecial = label === "";
          return `
          <article class="card">
            <div class="card-media"></div>
            <div class="card-body">
              <h3 class="card-name">${s.name}</h3>
              ${s.note ? `<p class="card-note">${s.note}</p>` : ''}
              <p class="card-desc">${s.desc}</p>
              <div class="card-footer">
                <div class="price-block ${isSpecial ? 'special' : ''}">
                  ${label ? `<span class="from">${label}</span>` : ''}
                  <span class="price">${isSpecial ? s.price : 'R$ ' + s.price}</span>
                </div>
                <a class="btn" href="${buildWhatsappLink(s)}" target="_blank" rel="noopener">Agendar →</a>
              </div>
            </div>
          </article>
        `}).join('')}
      </div>
    </section>
  `).join('');
}

renderFilters();
renderCatalog();

// Botão flutuante usa o mesmo WHATSAPP_NUMBER definido acima, com mensagem genérica
document.getElementById('whatsappFloat').href =
  `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('Olá, vim pelo catálogo e gostaria de saber mais sobre os serviços!')}`;
</script>
