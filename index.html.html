<title>Catálogo de Serviços — Espaço Sasso</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#6B1F30;
    --maroon-dark:#4C1622;
    --ivory:#FBF4F1;
    --ivory-2:#F1DEE3;
    --gold:#B98A5E;
    --espresso:#3B141F;
    --ink-soft:#8C6470;
    --line: rgba(107,31,48,0.16);
    --radius: 14px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--espresso);
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== HEADER ===== */
  header{
    position:relative;
    overflow:hidden;
    background:var(--ivory);
    padding:56px 24px 40px;
  }
  .header-inner{
    max-width:1080px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .logo-mark img{
    width:min(360px, 76vw);
    height:auto;
    display:block;
  }
  .catalog-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(24px, 3.2vw, 32px);
    color:var(--maroon);
    margin:14px 0 0;
    text-align:center;
  }
  .slogan-wrap{
    text-align:center;
    margin-top:16px;
  }
  .slogan{
    font-size:13px;
    letter-spacing:.32em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--maroon-dark);
  }

  /* ===== FILTERS ===== */
  .filters-wrap{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(251,247,243,0.94);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:16px 24px;
  }
  .category-select-wrap{
    max-width:1080px;
    margin:0 auto;
    display:flex;
    justify-content:center;
  }
  .category-select{
    appearance:none;
    -webkit-appearance:none;
    border:1.5px solid var(--maroon);
    background:#FFFFFE url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%236B1F30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>') no-repeat right 18px center;
    color:var(--maroon);
    padding:11px 44px 11px 22px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    font-family:'Manrope', sans-serif;
    cursor:pointer;
    outline:none;
    min-width:220px;
    text-align:center;
    text-align-last:center;
  }
  .category-select:focus{ border-color:var(--maroon-dark); }


  /* ===== GRID ===== */
  main{
    max-width:1080px;
    margin:0 auto;
    padding:48px 24px 100px;
  }
  .category-block{ margin-bottom:56px; }
  .category-title{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:23px;
    color:var(--cat-color, var(--maroon));
    margin:0 0 20px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .category-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .carousel-wrap{
    position:relative;
  }

  .grid{
    display:flex;
    flex-wrap:nowrap;
    gap:20px;
    overflow-x:auto;
    scroll-behavior:smooth;
    padding:2px 2px 14px;
    scrollbar-width:thin;
    scrollbar-color:var(--cat-color, var(--maroon)) var(--ivory-2);
  }
  .grid::-webkit-scrollbar{
    height:8px;
  }
  .grid::-webkit-scrollbar-track{
    background:#F1E9E1;
    border-radius:999px;
  }
  .grid::-webkit-scrollbar-thumb{
    background:var(--cat-color, var(--maroon));
    border-radius:999px;
  }

  .scroll-btn{
    position:absolute;
    top:calc(50% - 7px);
    transform:translateY(-50%);
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#FFFFFE;
    color:var(--cat-color, var(--maroon));
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 18px -8px rgba(59,20,31,0.35);
    z-index:5;
    font-size:16px;
    transition:background .18s ease, color .18s ease;
  }
  .scroll-btn:hover{
    background:var(--cat-color, var(--maroon));
    color:#fff;
  }
  .scroll-btn.left{ left:-8px; }
  .scroll-btn.right{ right:-8px; }

  .card{
    background:#FFFFFE;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    flex:0 0 260px;
    width:260px;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 30px -18px rgba(75,24,38,0.35);
  }
  .card-media{
    height:8px;
    background:var(--cat-color, var(--maroon));
  }
  .card-body{
    padding:20px 20px 22px;
    display:flex;
    flex-direction:column;
    flex:1;
  }
  .card-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18.5px;
    margin:0 0 2px;
    line-height:1.2;
  }
  .card-note{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:13.5px;
    color:var(--cat-color, var(--maroon));
    margin:0 0 10px;
  }
  .card-desc{
    font-size:13.5px;
    line-height:1.5;
    color:rgba(59,20,31,0.66);
    margin:0 0 16px;
    flex:1;
  }
  .card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .price-block .from{
    font-family:'Manrope',sans-serif;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.07em;
    color:rgba(59,20,31,0.45);
    display:block;
    margin-bottom:2px;
  }
  .price-block .price{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:17px;
    color:var(--cat-color, var(--maroon-dark));
  }
  .price-block.special .price{
    font-size:14.5px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--cat-color, var(--maroon));
    color:#fff;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    padding:10px 16px;
    border-radius:999px;
    transition:filter .18s ease;
    white-space:nowrap;
    flex-shrink:0;
  }
  .btn:hover{ filter:brightness(0.85); }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:rgba(59,20,31,0.5);
    font-size:15px;
    display:none;
  }

  footer{
    text-align:center;
    padding:32px 24px 16px;
    font-size:12.5px;
    color:rgba(59,20,31,0.45);
    border-top:1px solid var(--line);
  }

  /* ===== ASSINATURA / CARIMBO GENIX CATALOG ===== */
  .signature{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:0 24px 40px;
    flex-wrap:wrap;
  }
  .signature-stamp{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 14px 6px 6px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#FFFFFE;
  }
  .signature-mark{
    width:26px;
    height:26px;
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
  }
  .signature-mark img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .signature-text{
    font-size:11.5px;
    color:rgba(59,20,31,0.55);
    font-weight:600;
    letter-spacing:.02em;
  }
  .signature-link{
    font-size:11.5px;
    font-weight:700;
    color:var(--maroon);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color .18s ease;
  }
  .signature-link:hover{ border-bottom-color:var(--maroon); }

  /* ===== WHATSAPP FLOAT BUTTON ===== */
  .whatsapp-float{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:40;
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:14px 20px 14px 14px;
    border-radius:999px;
    box-shadow:0 10px 24px -8px rgba(37,211,102,0.55);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .whatsapp-float:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 30px -8px rgba(37,211,102,0.65);
  }
  .whatsapp-float svg{ width:26px; height:26px; flex-shrink:0; }
  .whatsapp-float span{ white-space:nowrap; }

  @media(max-width:600px){
    .whatsapp-float span{ display:none; }
    .whatsapp-float{ padding:14px; }
  }

  @media(max-width:600px){
    header{ padding:40px 18px 32px; }
    .filters-wrap{ padding:12px 14px; }
  }
</style>
</head>

const categorySelect = document.getElementById('categorySelect');
const emptyState = document.getElementById('emptyState');

const categories = ["Todos", ...Array.from(new Set(SERVICES.map(s => s.category)))];
let activeFilter = "Todos";

/* Paleta de cores por categoria — aplicada nos cards de serviço
   (barra superior, subtítulo, preço e botão) para facilitar a identificação.
   Edite os valores hex abaixo se quiser trocar as cores. */
const CATEGORY_PALETTE = ["#6B1F30", "#8E4A63", "#A6763E", "#5B6B4F", "#9C3F5A", "#7A4B8C", "#3E6B8A", "#7A5A2E"];
const CATEGORY_COLORS = {};
categories.filter(c => c !== "Todos").forEach((cat, i) => {
  CATEGORY_COLORS[cat] = CATEGORY_PALETTE[i % CATEGORY_PALETTE.length];
});

function buildWhatsappLink(service){
  const nomeCompleto = service.note ? `${service.name} (${service.note})` : service.name;
  const mensagem = `Olá! Vim pelo catálogo e quero agendar o(a) "${nomeCompleto}". Consigo agendar um horário?`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensagem)}`;
}

function renderSelect(){
  categorySelect.innerHTML = categories.map(cat =>
    `<option value="${cat}" ${cat === activeFilter ? 'selected' : ''}>${cat}</option>`
  ).join('');
}

function renderCatalog(){
  const grouped = {};
  SERVICES
    .filter(s => activeFilter === "Todos" || s.category === activeFilter)
    .forEach(s => {
      grouped[s.category] = grouped[s.category] || [];
      grouped[s.category].push(s);
    });

  const cats = Object.keys(grouped);
  emptyState.style.display = cats.length === 0 ? 'block' : 'none';

  catalogEl.innerHTML = cats.map((cat, idx) => {
    const color = CATEGORY_COLORS[cat] || '';
    const sectionStyle = color ? `style="--cat-color:${color}"` : '';
    const scrollId = `scroll-${idx}`;
    return `
    <section class="category-block" ${sectionStyle}>
      <h2 class="category-title">${cat}</h2>
      <div class="carousel-wrap">
        <button class="scroll-btn left" data-scroll="${scrollId}" data-dir="-1" aria-label="Rolar para a esquerda">←</button>
        <div class="grid" id="${scrollId}">
          ${grouped[cat].map(s => {
            const label = s.priceLabel === undefined ? "a partir de" : s.priceLabel;
            const isSpecial = label === "";
            return `
            <article class="card">
              <div class="card-media"></div>
              <div class="card-body">
                <h3 class="card-name">${s.name}</h3>
                ${s.note ? `<p class="card-note">${s.note}</p>` : ''}
                <p class="card-desc">${s.desc}</p>
                <div class="card-footer">
                  <div class="price-block ${isSpecial ? 'special' : ''}">
                    ${label ? `<span class="from">${label}</span>` : ''}
                    <span class="price">${isSpecial ? s.price : 'R$ ' + s.price}</span>
                  </div>
                  <a class="btn" href="${buildWhatsappLink(s)}" target="_blank" rel="noopener">Agendar →</a>
                </div>
              </div>
            </article>
          `}).join('')}
        </div>
        <button class="scroll-btn right" data-scroll="${scrollId}" data-dir="1" aria-label="Rolar para a direita">→</button>
      </div>
    </section>
  `}).join('');

  catalogEl.querySelectorAll('.scroll-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const track = document.getElementById(btn.dataset.scroll);
      const dir = Number(btn.dataset.dir);
      const cardWidth = 260 + 20; // largura do card + gap
      track.scrollBy({ left: dir * cardWidth * 2, behavior: 'smooth' });
    });
  });
}

categorySelect.addEventListener('change', () => {
  activeFilter = categorySelect.value;
  renderCatalog();
});

renderSelect();
renderCatalog();

// Botão flutuante usa o mesmo WHATSAPP_NUMBER definido acima, com mensagem genérica
document.getElementById('whatsappFloat').href =
  `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('Olá! Vim pelo catálogo do Espaço Sasso e queria saber mais sobre os serviços de vocês!')}`;
</script>

</body>
</html>
